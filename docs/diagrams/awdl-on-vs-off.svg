<text x="378.0" y="522" fill="#81baff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Router</text>
<rect x="436" y="493" width="92" height="43" rx="8" fill="#423325" stroke="none"/>
<text x="482.0" y="522" fill="#ffc47c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">AWDL</text>
<rect x="534" y="493" width="62" height="43" rx="8" fill="#173651" stroke="none"/>
<text x="565.0" y="522" fill="#81baff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">…</text>
<text x="68" y="582" fill="#effaf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">AWDL activity can make packets wait.</text>
<text x="68" y="615" fill="#a8bec3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Especially when it uses another channel.</text>
<rect x="656" y="181" width="584" height="462" rx="24" fill="#101f24" stroke="#294047"/>
<circle cx="690" cy="219" r="6" fill="#54e5be" stroke="none" stroke-width="2"/>
<text x="709" y="228" fill="#54e5be" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">BOOST ON</text>
<text x="684" y="269" fill="#a8bec3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="400" text-anchor="start">AWDL OFF  /  awdl0 DOWN</text>
<line x1="684" y1="291" x2="1212" y2="291" stroke="#294047" stroke-width="2" stroke-linecap="round"/>
