<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790" role="img" aria-labelledby="title desc">
<title id="title">AWDL on versus AWDL off with Boost</title>
<desc id="desc">Conceptual comparison of one Mac Wi-Fi radio. With Boost off, active AWDL can share radio time with router traffic, including channel switches. With Boost on, Stop Stutter repeatedly disables awdl0, removing this source of contention. AWDL being up does not mean continuous transmission. This is not a performance measurement.</desc>
<rect width="1280" height="790" fill="#081417"/>
<text x="40" y="43" fill="#54e5be" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="650" text-anchor="start">01  /  THE RADIO</text>
<text x="1240" y="43" fill="#a8bec3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="end">STOP STUTTER</text>
<text x="40" y="105" fill="#effaf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" text-anchor="start">Same Wi-Fi. Less contention.</text>
<text x="40" y="146" fill="#a8bec3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">Boost targets a source of stutter that a faster internet plan may not fix.</text>
<rect x="40" y="181" width="584" height="462" rx="24" fill="#101f24" stroke="#294047"/>
<circle cx="74" cy="219" r="6" fill="#ffc47c" stroke="none" stroke-width="2"/>
