<text x="948" y="414" fill="#effaf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">One Mac radio</text>
<text x="1160" y="414" fill="#a8bec3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" text-anchor="middle">Nearby peers</text>
<text x="684" y="473" fill="#a8bec3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="start">ILLUSTRATIVE RADIO TIME</text>
<rect x="684" y="493" width="528" height="43" rx="8" fill="#173651" stroke="none"/>
<text x="948" y="522" fill="#81baff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Router traffic • AWDL held off</text>
<text x="684" y="582" fill="#effaf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">More radio time for your stream.</text>
<text x="684" y="615" fill="#a8bec3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Other sources of jitter can still remain.</text>
<text x="40" y="693" fill="#effaf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start">When AWDL takes the radio off the router’s channel, stream packets can be delayed.</text>
<text x="40" y="735" fill="#a8bec3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Conceptual channel sharing, not a benchmark. AWDL being UP does not mean continuous activity.</text>
<text x="40" y="766" fill="#a8bec3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Actual behavior varies with the Mac, macOS version, nearby devices, and Wi-Fi environment.</text>
</svg>
