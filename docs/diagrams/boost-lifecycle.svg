<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="878" viewBox="0 0 1280 878" role="img" aria-labelledby="title desc">
<title id="title">Automatic Boost session and helper timing</title>
<desc id="desc">A selected app launches and Boost requests AWDL down immediately. A privileged helper repeats ifconfig awdl0 down once per second because macOS can reactivate AWDL. In Auto mode, the last selected app quitting releases Boost and the helper restores AWDL up. The normal-user app renews an authenticated XPC lease every two seconds. A lease expires after six seconds without renewal; the next helper tick attempts restoration when no leases remain.</desc>
<rect width="1280" height="878" fill="#081417"/>
<text x="40" y="43" fill="#54e5be" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="650" text-anchor="start">03  /  AUTOMATION</text>
<text x="1240" y="43" fill="#a8bec3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="end">STOP STUTTER</text>
<text x="40" y="105" fill="#effaf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" text-anchor="start">One session. No repeated commands.</text>
<text x="40" y="146" fill="#a8bec3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">Choose your apps once. In Auto mode, Boost follows them from launch to quit.</text>
<rect x="40" y="183" width="376" height="157" rx="20" fill="#101f24" stroke="#294047"/>
<text x="64" y="218" fill="#81baff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700" text-anchor="start">01</text>
<text x="64" y="263" fill="#effaf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="650" text-anchor="start">Open a selected app</text>
<text x="64" y="304" fill="#a8bec3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Request AWDL down immediately.</text>
<rect x="452" y="183" width="376" height="157" rx="20" fill="#101f24" stroke="#294047"/>
<text x="476" y="218" fill="#54e5be" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700" text-anchor="start">02</text>
<text x="476" y="263" fill="#effaf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="650" text-anchor="start">Keep playing</text>
<text x="476" y="304" fill="#a8bec3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Repeat down every second.</text>
<rect x="864" y="183" width="376" height="157" rx="20" fill="#101f24" stroke="#294047"/>
<text x="888" y="218" fill="#81baff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700" text-anchor="start">03</text>
<text x="888" y="263" fill="#effaf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start">Quit the last selected app</text>
<text x="888" y="304" fill="#a8bec3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Release Boost and restore AWDL.</text>
<line x1="425" y1="260" x2="443" y2="260" stroke="#54e5be" stroke-width="3" stroke-linecap="round"/>
<path d="M 435 254 L 443 260 L 435 266" fill="none" stroke="#54e5be" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="837" y1="260" x2="855" y2="260" stroke="#54e5be" stroke-width="3" stroke-linecap="round"/>
<path d="M 847 254 L 855 260 L 847 266" fill="none" stroke="#54e5be" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="365" width="1200" height="206" rx="24" fill="#101f24" stroke="#294047"/>
<text x="68" y="405" fill="#54e5be" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="650" text-anchor="start">WHY ONCE IS NOT ENOUGH</text>
<text x="68" y="447" fill="#effaf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="650" text-anchor="start">macOS can bring AWDL back up.</text>
<text x="68" y="483" fill="#a8bec3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">The helper keeps reapplying down</text>
<text x="68" y="514" fill="#a8bec3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">for as long as Boost is requested.</text>
<line x1="559" y1="449" x2="1007" y2="449" stroke="#54e5be" stroke-width="3" stroke-linecap="round"/>
<line x1="1007" y1="449" x2="1187" y2="449" stroke="#81baff" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 8"/>
<circle cx="571" cy="449" r="8" fill="#54e5be" stroke="none" stroke-width="2"/>
<text x="571" y="432" fill="#a8bec3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" text-anchor="middle">0s</text>
<text x="571" y="486" fill="#54e5be" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="650" text-anchor="middle">DOWN</text>
<circle cx="676" cy="449" r="8" fill="#54e5be" stroke="none" stroke-width="2"/>
<text x="676" y="432" fill="#a8bec3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" text-anchor="middle">1s</text>
<text x="676" y="486" fill="#54e5be" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="650" text-anchor="middle">DOWN</text>
<circle cx="781" cy="449" r="8" fill="#54e5be" stroke="none" stroke-width="2"/>
<text x="781" y="432" fill="#a8bec3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" text-anchor="middle">2s</text>
<text x="781" y="486" fill="#54e5be" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="650" text-anchor="middle">DOWN</text>
<circle cx="886" cy="449" r="8" fill="#54e5be" stroke="none" stroke-width="2"/>
<text x="886" y="432" fill="#a8bec3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" text-anchor="middle">3s</text>
<text x="886" y="486" fill="#54e5be" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="650" text-anchor="middle">DOWN</text>
<circle cx="991" cy="449" r="8" fill="#54e5be" stroke="none" stroke-width="2"/>
<text x="991" y="432" fill="#a8bec3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" text-anchor="middle">4s</text>
<text x="991" y="486" fill="#54e5be" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="650" text-anchor="middle">DOWN</text>
<circle cx="1165" cy="449" r="8" fill="#81baff" stroke="none" stroke-width="2"/>
<text x="1165" y="432" fill="#a8bec3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">last quit</text>
<text x="1165" y="486" fill="#81baff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="650" text-anchor="middle">UP</text>
<text x="559" y="543" fill="#a8bec3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Repeating command cadence, not AWDL’s protocol schedule.</text>
<rect x="40" y="595" width="1200" height="169" rx="24" fill="#101f24" stroke="#294047"/>
<text x="68" y="632" fill="#a8bec3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="650" text-anchor="start">TWO CLOCKS, DIFFERENT JOBS</text>
<text x="68" y="675" fill="#effaf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="650" text-anchor="start">SwiftUI app</text>
<text x="68" y="712" fill="#a8bec3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Normal user • renews lease every 2s</text>
<line x1="469" y1="672" x2="774" y2="672" stroke="#54e5be" stroke-width="3" stroke-linecap="round"/>
<path d="M 766 666 L 774 672 L 766 678" fill="none" stroke="#54e5be" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="621" y="659" fill="#54e5be" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="550" text-anchor="middle">Authenticated XPC</text>
<text x="621" y="712" fill="#a8bec3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle">Boolean Boost request</text>
<text x="810" y="675" fill="#effaf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="650" text-anchor="start">macOS-managed helper</text>
<text x="810" y="712" fill="#a8bec3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Privileged • applies down every 1s</text>
<text x="40" y="810" fill="#effaf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="500" text-anchor="start">App stops responding? Its lease expires after 6s without renewal; the next tick attempts restore.</text>
<text x="40" y="851" fill="#a8bec3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Restore waits for all leases to end. Status is checked; failed restoration is retried. Timers are approximate.</text>
</svg>
