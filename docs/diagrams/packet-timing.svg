<text x="835" y="374" fill="#ffc47c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Delayed packets arrive together</text>
