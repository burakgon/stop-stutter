<circle cx="56" cy="579" r="16" fill="#1d3738" stroke="none" stroke-width="2"/>
<text x="56" y="586" fill="#54e5be" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">1</text>
<text x="84" y="587" fill="#effaf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="650" text-anchor="start">Radio time is shared</text>
<text x="40" y="623" fill="#a8bec3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Active AWDL can delay Wi-Fi traffic.</text>
<circle cx="468" cy="579" r="16" fill="#1d3738" stroke="none" stroke-width="2"/>
<text x="468" y="586" fill="#54e5be" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">2</text>
<text x="496" y="587" fill="#effaf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="650" text-anchor="start">A frame arrives late</text>
<text x="452" y="623" fill="#a8bec3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">The stream may miss its deadline.</text>
<circle cx="880" cy="579" r="16" fill="#1d3738" stroke="none" stroke-width="2"/>
<text x="880" y="586" fill="#54e5be" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">3</text>
<text x="908" y="587" fill="#effaf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="650" text-anchor="start">You feel the hitch</text>
<text x="864" y="623" fill="#a8bec3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Video, audio, or input can stutter.</text>
<line x1="40" y1="658" x2="1240" y2="658" stroke="#294047" stroke-width="2" stroke-linecap="round"/>
<text x="40" y="695" fill="#effaf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="500" text-anchor="start">Boost can help when AWDL causes that delay; it does not fix every cause of stutter.</text>
<text x="40" y="728" fill="#a8bec3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Conceptual timing only. These are not measured or guaranteed before-and-after results.</text>
</svg>
