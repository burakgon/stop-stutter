<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="748" viewBox="0 0 1280 748" role="img" aria-labelledby="title desc">
<title id="title">Why packet timing matters to game streaming</title>
<desc id="desc">Two illustrative arrival timelines carry the same eight packets. One has a gap followed by a burst; the other is evenly spaced. Average throughput alone does not describe jitter. Packets delayed by AWDL contention can miss a frame deadline. Disabling AWDL can remove that delay source, but does not guarantee even delivery. The timelines are not measurements or guaranteed before and after results.</desc>
<rect width="1280" height="748" fill="#081417"/>
<text x="40" y="43" fill="#54e5be" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="650" text-anchor="start">02  /  PACKET TIMING</text>
<text x="1240" y="43" fill="#a8bec3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="end">STOP STUTTER</text>
<text x="40" y="105" fill="#effaf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" text-anchor="start">Fast internet can still feel slow.</text>
<text x="40" y="146" fill="#a8bec3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">A stream needs data on time. Average bandwidth does not show every interruption.</text>
<rect x="40" y="183" width="1200" height="347" rx="24" fill="#101f24" stroke="#294047"/>
<text x="72" y="225" fill="#a8bec3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" text-anchor="start">SAME PACKET COUNT. DIFFERENT ARRIVAL TIMING.</text>
<text x="1197" y="225" fill="#a8bec3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="end">time →</text>
<text x="72" y="301" fill="#ffc47c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="650" text-anchor="start">Uneven delivery</text>
<text x="72" y="336" fill="#a8bec3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Gap, then a burst</text>
<line x1="341" y1="309" x2="1197" y2="309" stroke="#294047" stroke-width="2" stroke-linecap="round"/>
<text x="72" y="445" fill="#54e5be" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="650" text-anchor="start">Steadier delivery</text>
<text x="72" y="480" fill="#a8bec3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Less arrival-time variation</text>
<line x1="341" y1="453" x2="1197" y2="453" stroke="#294047" stroke-width="2" stroke-linecap="round"/>
<rect x="493" y="264" width="273" height="88" rx="10" fill="#322a22" stroke="none"/>
<text x="629" y="298" fill="#ffc47c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="middle">Packets wait</text>
<text x="629" y="328" fill="#a8bec3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle">e.g. radio unavailable</text>
